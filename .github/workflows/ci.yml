name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Rust, protocol and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run controller and physics scenarios
        run: cargo test --workspace --locked
      - name: Check standalone flight core
        run: cargo check -p flight-core --target wasm32-unknown-unknown --locked
      - name: Build the simulator
        run: cargo build -p drone-sim --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Check live HTTP and WebSocket behavior
        run: npm test
      - name: Install Chrome for browser tests
        run: npx playwright install --with-deps chrome
      - name: Check the complete browser flight flow
        run: npm run test:browser
      - name: Save browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            test-results/
            output/flight-deck-*.png
          if-no-files-found: ignore
          retention-days: 7

  esp32:
    name: ESP32 image, guest CPU and device workbench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native emulator prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev zlib1g-dev python3
      - name: Install stable Rust for the host
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install pinned Xtensa tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/esp32_firmware.py setup
      - name: Check boot-only behavior and build flash artifacts
        run: |
          python3 scripts/esp32_firmware.py test
          python3 scripts/esp32_firmware.py build
          python3 scripts/esp32_firmware.py build-fixture
      - name: Build the pinned functional CPU backend
        run: python3 scripts/setup_emulator.py
      - name: Check image integrity and actual guest peripheral behavior
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install browser checks
        run: npm ci && npx playwright install --with-deps chrome
      - name: Check assembling devices and uploading guest firmware
        run: AEROLAB_REQUIRE_EMULATOR=1 npx playwright test tests/browser/workbench.spec.mjs
      - name: Save firmware and workbench evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp32-boot-only-and-simulation-fixture
          path: |
            output/firmware/esp32-devkitc-m1/
            output/firmware/simulation-fixture/
            output/device-workbench-*.png
            test-results/
          if-no-files-found: warn
          retention-days: 7
