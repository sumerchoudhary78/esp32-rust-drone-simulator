[package]
name = "aerolab-esp32-devkitc"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/sumerchoudhary78/esp32-rust-drone-simulator"
description = "ESP32-DevKitC-32E flight controller and motor-inhibited bootstrap"
publish = false

[workspace]
resolver = "3"

[[bin]]
name = "aerolab-esp32-devkitc"
path = "src/main.rs"
test = false
bench = false
required-features = ["hardware"]

[[bin]]
name = "aerolab-sim-fixture"
path = "src/sim_fixture.rs"
test = false
bench = false
required-features = ["simulation-fixture"]

[[bin]]
name = "aerolab-flight-bench"
path = "src/bench.rs"
test = false
bench = false
required-features = ["bench-firmware"]

[features]
default = ["hardware"]
hardware = []
simulation-fixture = ["hardware", "esp-hal/unstable"]
bench-firmware = ["hardware", "esp-hal/unstable", "dep:static_cell", "dep:xtensa-lx"]
bench-wifi = ["bench-firmware", "dep:esp-radio", "dep:esp-rtos", "dep:esp-alloc", "dep:embassy-executor", "dep:embassy-net", "dep:embassy-time", "dep:edge-dhcp", "dep:edge-nal", "dep:edge-nal-embassy", "dep:heapless"]
bench-fault-injection = ["bench-firmware"]

[dependencies]
flight-core = { path = "../../crates/flight-core" }
embedded-hal = "=1.0.0"
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "=1.2.2", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "=0.18.0", features = ["esp32"] }
xtensa-lx = { version = "=0.13.0", optional = true }
static_cell = { version = "=2.1.1", optional = true }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32", "wifi", "unstable"], optional = true }
esp-rtos = { version = "=0.4.0", features = ["esp32", "embassy", "esp-radio"], optional = true }
esp-alloc = { version = "=0.11.0", features = ["esp32"], optional = true }
embassy-executor = { version = "=0.10.0", optional = true }
embassy-net = { version = "=0.9.1", features = ["medium-ethernet", "udp", "proto-ipv4"], optional = true }
embassy-time = { version = "=0.5.1", optional = true }

edge-dhcp = { version = "=0.8.0", features = ["io"], default-features = false, optional = true }
edge-nal = { version = "=0.7.0", optional = true }
edge-nal-embassy = { version = "=0.9.0", optional = true }
heapless = { version = "=0.9.3", optional = true }

[build-dependencies]
serde_json = "1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
